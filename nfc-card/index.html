<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e6e7ea">
<title>Mohanad Banbouk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen neumorphic card — logo strip on top, name, contact well, mobile/avatar row, save bar */
:root{--bg:#e6e7ea;--fg:#1c1d20;--muted:#8a8d94;--hi:rgba(255,255,255,.95);--sh:rgba(170,174,182,.75);--display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden}
.raise{background:var(--bg);border-radius:30px;box-shadow:10px 10px 24px var(--sh),-10px -10px 24px var(--hi)}
.inset{background:var(--bg);box-shadow:inset 6px 6px 14px var(--sh),inset -6px -6px 14px var(--hi)}
.main{width:100%;max-width:380px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:16px;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
.logos{display:flex;justify-content:space-between;gap:8px}
.logo{flex:1;aspect-ratio:1;border-radius:14px;background:#fff;display:grid;place-items:center;padding:5px;box-shadow:4px 4px 10px var(--sh),-4px -4px 10px var(--hi)}
.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.head{display:flex;justify-content:space-between;align-items:flex-start}
.name{font-family:var(--display);font-size:clamp(28px,8.5vw,34px);line-height:1.05;font-weight:500;letter-spacing:-.02em;margin:0}
.tags{display:flex;gap:6px}
.tag{width:28px;height:28px;border-radius:50%;border:1.5px solid #b9bcc3;display:grid;place-items:center;font-size:10px;font-family:var(--display);color:#6d7079}
.well{border-radius:22px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.well .lbl{font-size:11.5px;color:var(--muted)}
.well .val{font-family:var(--display);font-size:18px;letter-spacing:-.01em;margin-top:2px;display:flex;align-items:center;gap:8px}
.pill{font-size:9.5px;letter-spacing:.08em;background:#b9bcc3;color:#fff;border-radius:999px;padding:3px 8px;font-weight:600}
.circ{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#4a4d55;text-decoration:none;flex:none;box-shadow:5px 5px 12px var(--sh),-5px -5px 12px var(--hi);background:var(--bg);transition:transform .15s}
.circ:active{transform:scale(.94);box-shadow:inset 4px 4px 10px var(--sh),inset -4px -4px 10px var(--hi)}
.circ svg{width:20px;height:20px}
.grid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.phone{border-radius:22px;padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;min-width:0}
.phone .lbl{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.phone .num{font-family:var(--display);font-size:16px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.phone .mail{font-size:11px;color:#5b5e66;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:flex;align-items:center}
.avatar{width:92px;height:92px;border-radius:22px;background:linear-gradient(145deg,#2b2d33,#111216);display:grid;place-items:center;font-family:var(--display);font-size:34px;color:#e6e7ea;box-shadow:7px 7px 16px var(--sh),-7px -7px 16px var(--hi);position:relative}
.avatar small{position:absolute;top:8px;right:10px;font-size:12px}
.toggle{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:999px}
.toggle a{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:#4a4d55;text-decoration:none;box-shadow:4px 4px 10px var(--sh),-4px -4px 10px var(--hi);background:var(--bg)}
.toggle a:active{box-shadow:inset 3px 3px 8px var(--sh),inset -3px -3px 8px var(--hi)}
.toggle svg{width:18px;height:18px}
.bar{width:100%;max-width:380px;padding:14px;display:flex;gap:12px;align-items:center;animation:pop .8s .2s cubic-bezier(.2,.8,.2,1) both}
.save{flex:1;border-radius:999px;padding:16px;display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--display);font-size:18px;color:#3a3c43;text-decoration:none;transition:transform .15s}
.save:active{transform:scale(.98)}
.save svg{width:20px;height:20px}
.ig{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;color:#4a4d55;text-decoration:none;background:#d6d8dd;box-shadow:5px 5px 12px var(--sh),-5px -5px 12px var(--hi)}
.ig svg{width:24px;height:24px}
a:focus-visible{outline:2px solid #4a4d55;outline-offset:2px}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:700px){.avatar{width:76px;height:76px;font-size:28px}.main{gap:12px}.name{font-size:26px}}
</style>
</head>
