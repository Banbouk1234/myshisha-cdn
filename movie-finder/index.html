<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banbouk Movie Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{--bg:#0b0a0f;--surface:#17151f;--fg:#f3efe6;--muted:#9a95a8;--line:#2a2735;--accent:#ffb627;--yes:#3ddc84;--no:#ff4d6d;
 --display:"Bebas Neue",Impact,sans-serif;--body:"Manrope",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
 padding:max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.04em;white-space:nowrap;line-height:1}.logo b{color:var(--accent);font-weight:400}
.tabs{display:flex;gap:5px}.tab{white-space:nowrap;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 10px;font:600 12px var(--body)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.hint{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-bottom:8px}
.stage{flex:1;min-height:0;position:relative}
.card{position:absolute;inset:0;margin:auto;max-width:420px;border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:0 20px 50px rgba(0,0,0,.5);touch-action:none;user-select:none;display:flex;flex-direction:column}
.card.under{transform:scale(.95) translateY(14px);opacity:.6}.card.leave{transition:transform .35s,opacity .35s}
.art{flex:1;min-height:0;position:relative;background-size:cover;background-position:center top;background-color:#222;display:flex;align-items:flex-end;padding:18px}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.85))}
.art .big{position:relative;z-index:1;font-family:var(--display);color:#fff;font-size:clamp(34px,10vw,54px);line-height:.95;text-shadow:0 2px 12px rgba(0,0,0,.6);text-wrap:balance}
.art img.logo{position:relative;z-index:1;width:140px;height:140px;object-fit:contain;border-radius:28px;margin:auto;background:#fff;padding:12px}
.art.center{align-items:center;justify-content:center}
.meta{padding:14px 18px 16px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}.row b{color:var(--fg)}
.meta p{margin:0;font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip.on{color:var(--accent);border-color:var(--accent)}
.plogo{width:22px;height:22px;border-radius:5px;vertical-align:middle}
.stamp{position:absolute;top:22px;font-family:var(--display);font-size:40px;letter-spacing:.08em;padding:4px 12px;border:4px solid;border-radius:8px;opacity:0;z-index:2}
.stamp.like{left:20px;color:var(--yes);border-color:var(--yes);transform:rotate(-14deg)}.stamp.nope{right:20px;color:var(--no);border-color:var(--no);transform:rotate(14deg)}
.actions{display:flex;justify-content:center;gap:28px;padding:16px 0 6px}
.btn{width:66px;height:66px;border-radius:50%;border:2px solid;background:var(--surface);font-size:28px;display:grid;place-items:center}
.btn.no{color:var(--no);border-color:var(--no)}.btn.yes{color:var(--yes);border-color:var(--yes)}.btn.small{width:48px;height:48px;font-size:18px;color:var(--muted);border-color:var(--line);align-self:center}
.screen{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:8px 0}
.intro{margin:auto;max-width:420px;display:flex;flex-direction:column;gap:16px}
.intro h1{font-family:var(--display);font-size:clamp(52px,16vw,88px);line-height:.9;margin:0}.intro h1 em{font-style:normal;color:var(--accent)}
.intro p,.intro label{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
input{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:14px;font:500 14px var(--body);width:100%}
.cta{background:var(--accent);color:#000;border:none;border-radius:14px;padding:16px;font:700 16px var(--body)}
.list{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:0 auto;width:100%}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px;border:1px solid var(--line)}
.item img{width:52px;height:78px;border-radius:8px;object-fit:cover;flex:none;background:#333}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:15px}.item .t span{font-size:12px;color:var(--muted)}
.item button{background:none;border:none;color:var(--muted);font-size:20px}
.empty{color:var(--muted);text-align:center;margin:auto;max-width:300px;line-height:1.5}
.taste{max-width:420px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:8px}
.taste h3{margin:8px 0 2px;font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:.04em}
.bar{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:8px;font-size:13px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i b{display:block;height:100%;background:var(--accent)}.bar i b.neg{background:var(--no)}
.bar span{color:var(--muted);text-align:right}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;font:500 13px var(--body);padding:8px}
.err{color:var(--no);font-size:13px}
.rate{position:absolute;inset:0;z-index:5;background:rgba(11,10,15,.92);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;max-width:420px;margin:auto}
.rate h3{font-family:var(--display);font-size:30px;font-weight:400;margin:0;letter-spacing:.04em}.rate p{margin:0;color:var(--muted);font-size:14px}
.stars{display:flex;gap:10px}.stars button{background:none;border:none;font-size:40px;color:var(--line);padding:4px;cursor:pointer;line-height:1}.stars button.lit{color:var(--accent)}
.rate .lbl{font-size:13px;color:var(--accent);min-height:18px}
.item .t .r{color:var(--accent)}
.tbtn{position:absolute;top:14px;left:14px;z-index:3;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;font:700 12px var(--body);letter-spacing:.06em;backdrop-filter:blur(6px)}
.trailer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.trailer .frame{width:100%;max-width:720px;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}.trailer iframe{width:100%;height:100%;border:0}
.trailer .x{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--fg);border:1px solid var(--line);font-size:20px}
.trailer p{color:var(--muted);margin:0;font-size:14px}
.where{display:flex;flex-direction:column;gap:6px;margin-top:8px}.where h4{margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.where .free h4{color:var(--yes)}.where .paid h4{color:var(--no)}.where .row{gap:6px}
.pv{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px}
.item.open{flex-direction:column;align-items:stretch}.item .head{display:flex;gap:12px;align-items:center}
</style></head><body>
<header><div class="logo">BANBOUK <b>MOVIE FINDER</b></div>
 <div class="tabs" id="tabs" hidden>
  <button class="tab" aria-selected="true" data-tab="swipe">Swipe</button>
  <button class="tab" aria-selected="false" data-tab="list">My list <span id="count">0</span></button>
  <button class="tab" aria-selected="false" data-tab="find">Find</button><button class="tab" aria-selected="false" data-tab="taste">Taste</button></div></header>
<main>
 <section class="screen" id="s-intro"><div class="intro">
  <h1>SWIPE.<br>DON'T<br><em>SCROLL.</em></h1>
  <p>Right means yes, left means no. Genres first, then your streaming services, then movies that fit you.</p>
  <input id="key" type="hidden">
  <label for="region">Your country (for "where to watch")</label>
  <input id="region" value="AE" maxlength="2">
  <div class="err" id="err"></div>
  <button class="cta" id="start">Start swiping</button></div></section>
 <section class="screen" id="s-swipe" hidden style="overflow:hidden">
  <div class="hint" id="phaseLabel"></div><div class="stage" id="stage"></div>
  <div class="actions"><button class="btn no" id="bNo" aria-label="No">✕</button><button class="btn small" id="bUndo" aria-label="Undo">↶</button><button class="btn small" id="bSeen" aria-label="I watched this" title="I watched this">👁</button><button class="btn yes" id="bYes" aria-label="Yes">♥</button></div>
  <div class="hint" id="seenHint">✕ skip · ↶ undo · 👁 watched it · ♥ want to watch</div></section>
 <section class="screen" id="s-list" hidden><div class="list" id="list"></div></section>
 <section class="screen" id="s-find" hidden><div class="list">
  <input id="q" placeholder="Type a movie name…" autocomplete="off">
  <div id="found"></div></div></section>
 <section class="screen" id="s-taste" hidden><div class="taste" id="taste"></div></section>
</main>
<script>
const IMG="https://image.tmdb.org/t/p/";
const PREFERRED=["Netflix","Amazon Prime Video","Disney Plus","Apple TV+","Max","OSN+","Shahid VIP","Starzplay","HBO Max","Apple TV Plus"];
let state={phase:"genres",idx:0,genre:{},prov:{},decade:{},seen:{},liked:[],watched:[],history:[],key:"4b978fa1cf7f0d286ab2bfa47f92027a",region:"AE"};
try{Object.assign(state,JSON.parse(localStorage.getItem("banbouk-movie-finder")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("banbouk-movie-finder",JSON.stringify(state))}catch(e){}};
const $=id=>document.getElementById(id);
let GENRES=[],PROVIDERS=[],MOVIES={},pool=[],cur=null;

async function api(path,params={}){const u=new URL("https://api.themoviedb.org/3"+path);
 Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
 const h={};if(state.key.length>60)h.Authorization="Bearer "+state.key;else u.searchParams.set("api_key",state.key);
 const r=await fetch(u,{headers:h});if(!r.ok)throw new Error("TMDB "+r.status);return r.json();}

async function boot(){
 const [g,p]=await Promise.all([api("/genre/movie/list"),api("/watch/providers/movie",{watch_region:state.region})]);
 GENRES=g.genres.filter(x=>x.name!=="TV Movie");
 // picture for each genre: backdrop of its most popular movie
 await Promise.all(GENRES.map(async gen=>{const d=await api("/discover/movie",{with_genres:gen.id,sort_by:"popularity.desc",watch_region:state.region,include_adult:"false"});
  const m=d.results.find(x=>x.backdrop_path)||d.results[0];gen.backdrop=m?IMG+"w780"+m.backdrop_path:"";gen.example=m?m.title:"";}));
 const all=p.results.sort((a,b)=>a.display_priority-b.display_priority);
 PROVIDERS=PREFERRED.map(n=>all.find(x=>x.provider_name===n)).filter(Boolean);
 all.slice(0,14).forEach(x=>{if(!PROVIDERS.includes(x)&&PROVIDERS.length<12)PROVIDERS.push(x)});
 PROVIDERS.push({provider_id:0,provider_name:"IPTV",logo_path:""});
}

function show(name){["intro","swipe","list","find","taste"].forEach(s=>$("s-"+s).hidden=s!==name);
 document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===name));$("tabs").hidden=name==="intro";
 if(name==="list")renderList();if(name==="taste")renderTaste();}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>show(t.dataset.tab));
$("key").value=state.key;$("region").value=state.region;
$("start").onclick=async()=>{if($("key").value.trim())state.key=$("key").value.trim();state.region=$("region").value.trim().toUpperCase()||"AE";$("err").textContent="";
 if(!state.key){$("err").textContent="Paste a TMDB key first.";return}
 $("start").textContent="Loading…";try{await boot();save();show("swipe");render()}catch(e){$("err").textContent="Could not reach TMDB: "+e.message;$("start").textContent="Start swiping"}};

// ---------- movie feed ----------
const decadeOf=y=>Math.floor((y||2000)/10)*10;
function score(m){let s=0;m.genre_ids.forEach(g=>s+=(state.genre[g]||0)*2);s+=(state.decade[decadeOf(+String(m.release_date).slice(0,4))]||0)*0.8;
 s+=(m.vote_average-6.8)*1.2+Math.log10(m.popularity+1)*0.3;return s;}
async function refill(){const have=PROVIDERS.filter(p=>state.prov[p.provider_id]>0);const iptv=state.prov[0]>0;
 const likedG=Object.keys(state.genre).filter(g=>state.genre[g]>0);
 const params={sort_by:"popularity.desc",include_adult:"false","vote_count.gte":300,page:1+Math.floor(Object.keys(state.seen).length/15)};
 if(likedG.length)params.with_genres=likedG.join("|");
 if(!iptv&&have.length){params.watch_region=state.region;params.with_watch_providers=have.map(p=>p.provider_id).join("|");}
 const d=await api("/discover/movie",params);d.results.forEach(m=>{if(!MOVIES[m.id]&&!state.seen[m.id]){MOVIES[m.id]=m;pool.push(m)}});}
async function nextMovie(){pool=pool.filter(m=>!state.seen[m.id]);if(pool.length<6)await refill();if(!pool.length)return null;
 pool.sort((a,b)=>score(b)-score(a));const n=Math.min(pool.length,4);return pool[Math.random()<0.78?0:Math.floor(Math.random()*n)];}
async function providersFor(m){if(m._prov)return m._prov;try{const d=await api(`/movie/${m.id}/watch/providers`);const r=d.results[state.region]||{};
 m._prov=[...(r.flatrate||[]),...(r.ads||[])].slice(0,5)}catch(e){m._prov=[]}return m._prov;}

// ---------- cards ----------
async function currentCard(){
 if(state.phase==="genres"){const g=GENRES[state.idx];if(!g){state.phase="providers";state.idx=0;return currentCard()}
  return{kind:"genre",key:g.id,big:g.name,img:g.backdrop,sub:"Do you like",p:g.example?`Think "${g.example}". Swipe right if this is your kind of night.`:"Swipe right if this is your kind of night."}}
 if(state.phase==="providers"){const p=PROVIDERS[state.idx];if(!p){state.phase="movies";state.idx=0;return currentCard()}
  return{kind:"prov",key:p.provider_id,big:p.provider_name,logo:p.logo_path?IMG+"w185"+p.logo_path:"",sub:"Do you have",p:p.provider_id===0?"IPTV means you have everything. We'll stop filtering by service.":`Swipe right if you can watch ${p.provider_name} right now.`}}
 const m=await nextMovie();if(!m)return null;const prov=await providersFor(m);
 return{kind:"movie",key:m.id,m,prov,big:m.title,img:m.poster_path?IMG+"w500"+m.poster_path:(m.backdrop_path?IMG+"w780"+m.backdrop_path:""),p:m.overview}}

function cardEl(c){const el=document.createElement("div");el.className="card";let meta="",art="";
 if(c.kind==="prov")art=`<div class="art center" style="background:linear-gradient(160deg,#2a2735,#0b0a0f)">${c.logo?`<img class="logo" src="${c.logo}" alt="">`:`<div class="big">${c.big}</div>`}</div>`;
 else art=`<div class="art" style="background-image:url('${c.img}')">${c.kind==="movie"?`<button class="tbtn" data-trailer="${c.m.id}">▶ TRAILER</button>`:""}<div class="big">${c.big}</div></div>`;
 if(c.kind==="movie"){const m=c.m;const gn=m.genre_ids.map(id=>(GENRES.find(g=>g.id===id)||{}).name).filter(Boolean).slice(0,3).join(" · ");
  meta=`<div class="row"><b>${String(m.release_date).slice(0,4)}</b><span>★ ${m.vote_average.toFixed(1)}</span><span>${gn}</span></div>
  <div class="row">${c.prov.map(p=>`<img class="plogo" src="${IMG}w92${p.logo_path}" title="${p.provider_name}" alt="${p.provider_name}">`).join("")||`<span class="chip">Not streaming in ${state.region}</span>`}</div><p>${c.p||""}</p>`}
 else meta=`<div class="row" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">${c.sub} ${c.kind==="prov"?c.big:""}</div><p>${c.p}</p>`;
 el.innerHTML=`<div class="stamp like">LIKE</div><div class="stamp nope">NOPE</div>${art}<div class="meta">${meta}</div>`;
 const tb=el.querySelector(".tbtn");if(tb){tb.addEventListener("pointerdown",e=>e.stopPropagation());tb.onclick=e=>{e.stopPropagation();openTrailer(c.m)}}return el}
async function openTrailer(m){const o=document.createElement("div");o.className="trailer";o.innerHTML=`<button class="x" aria-label="Close">✕</button><div class="frame"></div><p>${m.title}</p>`;document.body.appendChild(o);
 o.querySelector(".x").onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};
 try{const d=await api(`/movie/${m.id}/videos`);const vs=d.results.filter(v=>v.site==="YouTube");
  const v=vs.find(v=>v.type==="Trailer"&&v.official)||vs.find(v=>v.type==="Trailer")||vs.find(v=>v.type==="Teaser")||vs[0];
  if(!v){o.querySelector(".frame").innerHTML=`<p style="padding:24px;text-align:center">No trailer available for this one.</p>`;return}
  o.querySelector(".frame").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${v.key}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
 }catch(e){o.querySelector(".frame").innerHTML=`<p style="padding:24px;text-align:center">Could not load trailer.</p>`}}

async function render(){const stage=$("stage");stage.innerHTML=`<div class="empty">Loading…</div>`;
 const c=await currentCard();cur=c;
 $("phaseLabel").textContent=state.phase==="genres"?`Genres · ${state.idx+1} of ${GENRES.length}`:state.phase==="providers"?`Your services · ${state.idx+1} of ${PROVIDERS.length}`:`Picked for you · ${state.liked.length} saved`;
 if(!c){stage.innerHTML=`<div class="empty">No more movies for your services. Check your list or reset.</div>`;return}
 stage.innerHTML="";const under=document.createElement("div");under.className="card under";stage.appendChild(under);
 const el=cardEl(c);stage.appendChild(el);attachDrag(el);
 if(c.kind==="movie")nextMovie(); // warm the pool
}
function snapshot(){return JSON.stringify({genre:state.genre,prov:state.prov,decade:state.decade,seen:state.seen,liked:state.liked,watched:state.watched||[],phase:state.phase,idx:state.idx})}
function decide(yes){if(!cur)return;const c=cur;state.history.push(snapshot());if(state.history.length>30)state.history.shift();const d=yes?1:-1;
 if(c.kind==="genre"){state.genre[c.key]=d;state.idx++}else if(c.kind==="prov"){state.prov[c.key]=d;state.idx++}
 else{const m=c.m;state.seen[m.id]=d;m.genre_ids.forEach(g=>state.genre[g]=(state.genre[g]||0)+d*0.5);
  const dec=decadeOf(+String(m.release_date).slice(0,4));state.decade[dec]=(state.decade[dec]||0)+d*0.5;
  if(yes)state.liked.push({id:m.id,title:m.title,year:String(m.release_date).slice(0,4),rating:m.vote_average,poster:m.poster_path,prov:(c.prov||[]).map(p=>p.provider_name)});}
 $("count").textContent=state.liked.length;save();render()}
function undo(){const h=state.history.pop();if(!h)return;Object.assign(state,JSON.parse(h));$("count").textContent=state.liked.length;save();render()}
const RATE_LABELS=["","Hated it","Not for me","It was okay","Really liked it","Loved it"];
const RATE_WEIGHT=[0,-1.5,-1,0,1,1.6];
$("bSeen").onclick=()=>{if(!cur||cur.kind!=="movie")return;const m=cur.m;const st=$("stage");
 const o=document.createElement("div");o.className="rate";o.innerHTML=`<h3>${m.title}</h3><p>How was it? Your rating shapes what we suggest next.</p>
 <div class="stars">${[1,2,3,4,5].map(i=>`<button data-r="${i}" aria-label="${RATE_LABELS[i]}">★</button>`).join("")}</div><div class="lbl"></div><button class="link" id="rateSkip">Watched it, skip rating</button>`;
 st.appendChild(o);const bs=[...o.querySelectorAll(".stars button")];
 const light=n=>{bs.forEach((b,i)=>b.classList.toggle("lit",i<n));o.querySelector(".lbl").textContent=RATE_LABELS[n]||""};
 bs.forEach(b=>{b.onmouseenter=()=>light(+b.dataset.r);b.onmouseleave=()=>light(0);b.onclick=()=>{light(+b.dataset.r);setTimeout(()=>markWatched(m,+b.dataset.r,cur.prov),250)}});
 $("rateSkip").onclick=()=>markWatched(m,0,cur.prov);};
function markWatched(m,r,prov){state.history.push(snapshot());if(state.history.length>30)state.history.shift();
 state.seen[m.id]="w";const w=RATE_WEIGHT[r]||0;
 m.genre_ids.forEach(g=>state.genre[g]=(state.genre[g]||0)+w*0.6);const dec=decadeOf(+String(m.release_date).slice(0,4));state.decade[dec]=(state.decade[dec]||0)+w*0.5;
 (state.watched=state.watched||[]).unshift({id:m.id,title:m.title,year:String(m.release_date).slice(0,4),rating:m.vote_average,poster:m.poster_path,r});
 save();render()}
$("bYes").onclick=()=>fling(true);$("bNo").onclick=()=>fling(false);$("bUndo").onclick=undo;
document.addEventListener("keydown",e=>{if($("s-swipe").hidden)return;if(e.key==="ArrowRight")fling(true);if(e.key==="ArrowLeft")fling(false)});
function fling(yes){const el=$("stage").querySelector(".card:not(.under)");if(!el){decide(yes);return}
 el.classList.add("leave");el.style.transform=`translateX(${yes?120:-120}%) rotate(${yes?18:-18}deg)`;el.style.opacity="0";
 el.querySelector(yes?".stamp.like":".stamp.nope").style.opacity=1;setTimeout(()=>decide(yes),260)}
function attachDrag(el){let sx=0,sy=0,dx=0,down=false;
 el.addEventListener("pointerdown",e=>{down=true;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId);el.classList.remove("leave")});
 el.addEventListener("pointermove",e=>{if(!down)return;dx=e.clientX-sx;const dy=e.clientY-sy;el.style.transform=`translate(${dx}px,${dy*0.3}px) rotate(${dx/18}deg)`;
  el.querySelector(".stamp.like").style.opacity=Math.min(1,Math.max(0,dx/90));el.querySelector(".stamp.nope").style.opacity=Math.min(1,Math.max(0,-dx/90))});
 const end=()=>{if(!down)return;down=false;if(Math.abs(dx)>100)fling(dx>0);else{el.classList.add("leave");el.style.transform="";el.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0)}dx=0};
 el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);}

// ---------- find ----------
let qt;$("q").oninput=()=>{clearTimeout(qt);qt=setTimeout(searchMovies,350)};
async function searchMovies(){const q=$("q").value.trim();const box=$("found");if(q.length<2){box.innerHTML="";return}
 box.innerHTML=`<div class="empty">Searching…</div>`;try{const d=await api("/search/movie",{query:q,include_adult:"false"});
 const res=d.results.slice(0,8);if(!res.length){box.innerHTML=`<div class="empty">No movie called "${q}".</div>`;return}
 box.innerHTML=res.map(m=>`<div class="item" data-id="${m.id}"><div class="head"><img src="${m.poster_path?IMG+"w185"+m.poster_path:""}" alt=""><div class="t"><b>${m.title}</b><span>${String(m.release_date||"").slice(0,4)} · ★ ${(m.vote_average||0).toFixed(1)}</span></div><span class="chip">Where?</span></div><div class="where"></div><button class="link" style="text-align:left;padding:6px 0" data-tr="${m.id}" data-title="${m.title.replace(/"/g,"&quot;")}">▶ Watch trailer</button></div>`).join("");
 box.querySelectorAll("[data-tr]").forEach(b=>b.onclick=e=>{e.stopPropagation();openTrailer({id:+b.dataset.tr,title:b.dataset.title})});
 box.querySelectorAll(".item").forEach(it=>it.onclick=()=>whereToWatch(it));}catch(e){box.innerHTML=`<div class="empty">Search failed: ${e.message}</div>`}}
async function whereToWatch(it){if(it.classList.contains("open"))return;it.classList.add("open");const w=it.querySelector(".where");w.innerHTML="Checking…";
 const d=await api(`/movie/${it.dataset.id}/watch/providers`);const r=d.results[state.region]||{};
 const have=new Set(PROVIDERS.filter(p=>state.prov[p.provider_id]>0).map(p=>p.provider_name));
 const pv=l=>(l||[]).map(p=>`<span class="pv ${have.has(p.provider_name)?"on":""}"><img class="plogo" src="${IMG}w92${p.logo_path}" alt="">${p.provider_name}${have.has(p.provider_name)?" ✓":""}</span>`).join("");
 const free=[...(r.free||[]),...(r.ads||[])];const sub=(r.flatrate||[]);const mine=sub.filter(p=>have.has(p.provider_name));const other=sub.filter(p=>!have.has(p.provider_name));
 const paid=[...new Map([...(r.rent||[]),...(r.buy||[])].map(p=>[p.provider_id,p])).values()];
 let h="";
 if(free.length)h+=`<div class="free"><h4>Free${free.some(p=>(r.ads||[]).includes(p))?" (with ads)":""}</h4><div class="row">${pv(free)}</div></div>`;
 if(mine.length)h+=`<div class="free"><h4>Included in your subscription</h4><div class="row">${pv(mine)}</div></div>`;
 if(other.length)h+=`<div><h4>Other subscriptions</h4><div class="row">${pv(other)}</div></div>`;
 if(paid.length)h+=`<div class="paid"><h4>${free.length||sub.length?"Also rent / buy":"Paid only — rent or buy"}</h4><div class="row">${pv(paid)}</div></div>`;
 if(!h)h=`<div class="paid"><h4>Not streaming in ${state.region}</h4><span style="font-size:13px;color:var(--muted)">Not on any service here right now${state.prov[0]>0?" — try your IPTV":""}.</span></div>`;
 else if(state.prov[0]>0&&!free.length&&!mine.length)h+=`<div class="free"><h4>IPTV</h4><span style="font-size:13px;color:var(--muted)">Likely on your IPTV box.</span></div>`;
 if(r.link)h+=`<a href="${r.link}" target="_blank" rel="noopener" class="link" style="text-align:left;padding:4px 0">Open on TMDB / JustWatch →</a>`;
 w.innerHTML=h;}

// ---------- list & taste ----------
function renderList(){const l=$("list");const wd=state.watched||[];if(!state.liked.length&&!wd.length){l.innerHTML=`<div class="empty">Nothing saved yet. Swipe right on a movie and it lands here.</div>`;return}
 const watchedHtml=wd.length?`<h3 style="font-family:var(--display);font-weight:400;letter-spacing:.04em;font-size:22px;margin:14px 0 0">Watched</h3>`+wd.map(m=>`<div class="item"><img src="${m.poster?IMG+"w185"+m.poster:""}" alt=""><div class="t"><b>${m.title}</b><span>${m.year} · <span class="r">${m.r?"★".repeat(m.r)+"☆".repeat(5-m.r):"not rated"}</span></span></div><button aria-label="Remove" data-rw="${m.id}">✕</button></div>`).join(""):"";
 l.innerHTML=(state.liked.length?`<h3 style="font-family:var(--display);font-weight:400;letter-spacing:.04em;font-size:22px;margin:0">Want to watch</h3>`:"")+state.liked.map(m=>`<div class="item"><img src="${m.poster?IMG+"w185"+m.poster:""}" alt=""><div class="t"><b>${m.title}</b><span>${m.year} · ★ ${(+m.rating).toFixed(1)}${m.prov.length?" · "+m.prov.join(", "):""}</span></div><button aria-label="Remove" data-rm="${m.id}">✕</button></div>`).join("")+watchedHtml;
 l.querySelectorAll("[data-rw]").forEach(b=>b.onclick=()=>{state.watched=state.watched.filter(x=>x.id!=+b.dataset.rw);delete state.seen[+b.dataset.rw];save();renderList()});
 l.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{state.liked=state.liked.filter(x=>x.id!=+b.dataset.rm);$("count").textContent=state.liked.length;save();renderList()});}
function bars(obj,label,name){const keys=Object.keys(obj).filter(k=>obj[k]!==0).sort((a,b)=>obj[b]-obj[a]);if(!keys.length)return"";const max=Math.max(1,...keys.map(k=>Math.abs(obj[k])));
 return`<h3>${label}</h3>`+keys.map(k=>`<div class="bar"><span style="text-align:left;color:var(--fg)">${name(k)}</span><i><b class="${obj[k]<0?"neg":""}" style="width:${Math.abs(obj[k])/max*100}%"></b></i><span>${obj[k]>0?"+":""}${(+obj[k]).toFixed(1)}</span></div>`).join("")}
function renderTaste(){const t=$("taste");
 t.innerHTML=`<p style="color:var(--muted);margin:0;font-size:14px">${Object.keys(state.seen).length} movies swiped. Every swipe shifts these weights; the next card is the best unseen match on a service you have.</p>`
 +bars(state.genre,"Genres",k=>(GENRES.find(g=>g.id==k)||{name:k}).name)+bars(state.decade,"Era",k=>k+"s")
 +`<h3>Services</h3><div class="row">${PROVIDERS.map(p=>`<span class="chip ${state.prov[p.provider_id]>0?"on":""}">${p.provider_name}</span>`).join("")}</div>
 <button class="link" id="reset">Reset taste and start over</button>`;
 $("reset").onclick=()=>{Object.assign(state,{phase:"genres",idx:0,genre:{},prov:{},decade:{},seen:{},liked:[],watched:[],history:[]});pool=[];MOVIES={};save();$("count").textContent=0;show("intro")};}

$("count").textContent=state.liked.length;
if(state.key&&(state.phase!=="genres"||state.idx>0)){boot().then(()=>{show("swipe");render()}).catch(()=>show("intro"))}else show("intro");
</script></body></html>
