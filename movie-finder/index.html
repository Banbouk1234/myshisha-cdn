 --display:"Bebas Neue",Impact,sans-serif;--body:"Manrope",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}

 padding:max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.04em;white-space:nowrap;line-height:1}.logo b{color:var(--accent);font-weight:400}
.tabs{display:flex;gap:5px;width:100%;justify-content:space-between}.tab{white-space:nowrap;flex:1;text-align:center;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 4px;font:600 13px var(--body)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.hint{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-bottom:8px}

.card{position:absolute;inset:0;margin:auto;max-width:420px;border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:0 20px 50px rgba(0,0,0,.5);touch-action:none;user-select:none;display:flex;flex-direction:column}
.card.under{transform:scale(.95) translateY(14px);opacity:.6}.card.leave{transition:transform .35s,opacity .35s}
.art{flex:1;min-height:0;position:relative;background-size:cover;background-position:center top;background-color:#222;display:flex;align-items:flex-end;padding:18px}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.85))}
.art .big{position:relative;z-index:1;font-family:var(--display);color:#fff;font-size:clamp(34px,10vw,54px);line-height:.95;text-shadow:0 2px 12px rgba(0,0,0,.6);text-wrap:balance}
.art img.logo{position:relative;z-index:1;width:140px;height:140px;object-fit:contain;border-radius:28px;margin:auto;background:#fff;padding:12px}
.art.center{align-items:center;justify-content:center}
.meta{padding:10px 16px 12px;display:flex;flex-direction:column;gap:5px;max-height:46%;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}.row b{color:var(--fg)}
.meta p{margin:0;font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip.on{color:var(--accent);border-color:var(--accent)}
.plogo{width:22px;height:22px;border-radius:5px;vertical-align:middle}
.stamp{position:absolute;top:22px;font-family:var(--display);font-size:40px;letter-spacing:.08em;padding:4px 12px;border:4px solid;border-radius:8px;opacity:0;z-index:2}
.stamp.like{left:20px;color:var(--yes);border-color:var(--yes);transform:rotate(-14deg)}.stamp.nope{right:20px;color:var(--no);border-color:var(--no);transform:rotate(14deg)}
.actions{display:flex;justify-content:center;gap:28px;padding:16px 0 6px}
.btn{width:66px;height:66px;border-radius:50%;border:2px solid;background:var(--surface);font-size:28px;display:grid;place-items:center}
.btn.no{color:var(--no);border-color:var(--no)}.btn.yes{color:var(--yes);border-color:var(--yes)}.btn.small{width:48px;height:48px;font-size:18px;color:var(--muted);border-color:var(--line);align-self:center}
.screen{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:8px 0}
.intro{margin:auto;max-width:420px;display:flex;flex-direction:column;gap:16px}
.intro h1{font-family:var(--display);font-size:clamp(52px,16vw,88px);line-height:.9;margin:0}.intro h1 em{font-style:normal;color:var(--accent)}
.intro p,.intro label{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
input{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:14px;font:500 14px var(--body);width:100%}
.cta{background:var(--accent);color:#000;border:none;border-radius:14px;padding:16px;font:700 16px var(--body)}
.list{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:0 auto;width:100%}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px;border:1px solid var(--line)}
.item img{width:52px;height:78px;border-radius:8px;object-fit:cover;flex:none;background:#333}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:15px}.item .t span{font-size:12px;color:var(--muted)}
.item button{background:none;border:none;color:var(--muted);font-size:20px}
.empty{color:var(--muted);text-align:center;margin:auto;max-width:300px;line-height:1.5}
.taste{max-width:420px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:8px}
.taste h3{margin:8px 0 2px;font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:.04em}
.bar{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:8px;font-size:13px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i b{display:block;height:100%;background:var(--accent)}.bar i b.neg{background:var(--no)}
.bar span{color:var(--muted);text-align:right}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;font:500 13px var(--body);padding:8px}
.err{color:var(--no);font-size:13px}
.fbtn{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 12px;font:700 12px var(--body);display:inline-flex;align-items:center;gap:6px}
.fbtn i{font-style:normal;background:var(--accent);color:#000;border-radius:999px;padding:0 7px;font-size:11px}
.sheet{width:100%;max-width:460px;max-height:85vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;text-align:start}
.sheet h3{font-family:var(--display);font-size:26px;font-weight:400;margin:0;letter-spacing:.04em}
.sheet h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 12px;font:600 13px var(--body)}.chips button.on{background:var(--accent);color:#000;border-color:var(--accent)}
.sheet .acts{display:flex;gap:10px}.sheet .acts .cta{flex:1}
.sharebtn{margin-inline-start:auto;background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:4px 10px;font:700 12px var(--body)}
.detail{width:100%;max-width:460px;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;text-align:start}
.detail .cover{aspect-ratio:16/9;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;padding:16px}
.detail .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.8))}
.detail .cover h3{position:relative;z-index:1;font-family:var(--display);font-size:34px;font-weight:400;margin:0;color:#fff;letter-spacing:.03em;line-height:.95}
.detail .body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px}.detail .body p{margin:0;font-size:14px;line-height:1.5}
.detail .acts{display:flex;gap:8px;flex-wrap:wrap}.detail .acts button{flex:1;min-width:110px}
.cta2{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:14px;font:700 15px var(--body)}
.steps{display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.steps b{display:block;font-family:var(--display);font-size:22px;letter-spacing:.04em;font-weight:400}.steps p{margin:0;font-size:15px;line-height:1.5;color:var(--fg)}.steps p strong{color:var(--accent)}.steps p span{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;text-align:center;line-height:24px;font-weight:700;margin-inline-end:8px;font-size:13px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}

.rate h3{font-family:var(--display);font-size:30px;font-weight:400;margin:0;letter-spacing:.04em}.rate p{margin:0;color:var(--muted);font-size:14px}
.stars{display:flex;gap:10px}.stars button{background:none;border:none;font-size:40px;color:var(--line);padding:4px;cursor:pointer;line-height:1}.stars button.lit{color:var(--accent)}
.rate .lbl{font-size:13px;color:var(--accent);min-height:18px}
.item .t .r{color:var(--accent)}
.tbtn{position:absolute;top:26px;left:14px;z-index:3;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;font:700 12px var(--body);letter-spacing:.06em;backdrop-filter:blur(6px)}

.trailer p{color:var(--muted);margin:0;font-size:14px}
.tbtn.cast{left:auto;right:14px}

.art{transition:background-image .2s}

.trailer h3{font-family:var(--display);font-size:28px;font-weight:400;margin:0;letter-spacing:.04em;color:var(--fg)}
.where{display:flex;flex-direction:column;gap:6px;margin-top:4px}.where h4{margin:2px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.item.open{flex-direction:column;align-items:stretch}.item .head{display:flex;gap:12px;align-items:center}

function rateDialog(m,st,done){
 const o=document.createElement("div");o.className="rate";if(st===document.body)o.classList.add("fixed");o.innerHTML=`<h3>${m.title}</h3><p>${t("howwas")}</p>
 <div class="stars">${[1,2,3,4,5].map(i=>`<button data-r="${i}" aria-label="${RATE_LABELS()[i]}">★</button>`).join("")}</div><div class="lbl"></div><button class="link" id="rateSkip">${t("skiprate")}</button>`;
 st.appendChild(o);const bs=[...o.querySelectorAll(".stars button")];
 const light=n=>{bs.forEach((b,i)=>b.classList.toggle("lit",i<n));o.querySelector(".lbl").textContent=RATE_LABELS()[n]||""};
 bs.forEach(b=>{b.onmouseenter=()=>light(+b.dataset.r);b.onmouseleave=()=>light(0);b.onclick=()=>{light(+b.dataset.r);setTimeout(()=>{o.remove();done(+b.dataset.r)},250)}});
 o.querySelector("#rateSkip").onclick=()=>{o.remove();done(0)};o.onclick=e=>{if(e.target===o&&st===document.body)o.remove()}};
function markWatched(m,r,prov){state.history.push(snapshot());if(state.history.length>30)state.history.shift();
 state.seen[mt(m)+m.id]="w";const w=RATE_WEIGHT[r]||0;
 m.genre_ids.forEach(g=>state.genre[g]=(state.genre[g]||0)+w*0.6);const dec=decadeOf(+String(m.release_date).slice(0,4));state.decade[dec]=(state.decade[dec]||0)+w*0.5;
 (state.watched=state.watched||[]).unshift({id:m.id,type:mt(m),title:m.title,year:String(m.release_date).slice(0,4),rating:m.vote_average,poster:m.poster_path,r});
 save();if(!$("s-swipe").hidden)render()}
$("bYes").onclick=()=>fling(true);$("bNo").onclick=()=>fling(false);$("bUndo").onclick=undo;
document.addEventListener("keydown",e=>{if($("s-swipe").hidden)return;if(e.key==="ArrowRight")fling(true);if(e.key==="ArrowLeft")fling(false)});
function fling(yes){const el=$("stage").querySelector(".card:not(.under)");if(!el){decide(yes);return}
 el.classList.add("leave");el.style.transform=`translateX(${yes?120:-120}%) rotate(${yes?18:-18}deg)`;el.style.opacity="0";
 el.querySelector(yes?".stamp.like":".stamp.nope").style.opacity=1;setTimeout(()=>decide(yes),260)}
function attachDrag(el){let sx=0,sy=0,dx=0,down=false;
 el.addEventListener("pointerdown",e=>{down=true;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId);el.classList.remove("leave")});
 el.addEventListener("pointermove",e=>{if(!down)return;dx=e.clientX-sx;const dy=e.clientY-sy;el.style.transform=`translate(${dx}px,${dy*0.3}px) rotate(${dx/18}deg)`;
  el.querySelector(".stamp.like").style.opacity=Math.min(1,Math.max(0,dx/90));el.querySelector(".stamp.nope").style.opacity=Math.min(1,Math.max(0,-dx/90))});
 const end=()=>{if(!down)return;down=false;if(Math.abs(dx)>100)fling(dx>0);else{el.classList.add("leave");el.style.transform="";el.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0)}dx=0};
 el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);}

// ---------- find ----------
let qt;$("q").oninput=()=>{clearTimeout(qt);qt=setTimeout(searchMovies,350)};
async function searchMovies(){const q=$("q").value.trim();const box=$("found");if(q.length<2){box.innerHTML="";return}
 box.innerHTML=`<div class="empty">${t("searching")}</div>`;try{const d=await api("/search/multi",{query:q,include_adult:"false"});
 const res=d.results.filter(x=>x.media_type==="movie"||x.media_type==="tv").map(x=>norm(x)).slice(0,8);if(!res.length){box.innerHTML=`<div class="empty">${t("nomovie",{x:q})}</div>`;return}
 box.innerHTML=res.map(m=>`<div class="item" data-id="${m.id}" data-type="${mt(m)}"><div class="head"><img src="${m.poster_path?IMG+"w185"+m.poster_path:""}" alt=""><div class="t"><b>${m.title}</b><span>${String(m.release_date||"").slice(0,4)} · ★ ${(m.vote_average||0).toFixed(1)}${mt(m)==="tv"?" · "+t("series"):""}</span></div><span class="chip">${t("where")}</span></div><div class="where"></div><button class="link" style="text-align:start;padding:6px 0" data-tr="${m.id}" data-ty="${mt(m)}" data-title="${m.title.replace(/"/g,"&quot;")}">${t("watchtrailer")}</button><button class="link" style="text-align:start;padding:6px 0" data-cast="${m.id}" data-ty="${mt(m)}" data-title="${m.title.replace(/"/g,"&quot;")}">${t("castlink")}</button><button class="link" style="text-align:start;padding:6px 0" data-fsh="${m.id}" data-ty="${mt(m)}" data-title="${m.title.replace(/"/g,"&quot;")}" data-y="${String(m.release_date||"").slice(0,4)}">↗ ${t("share")}</button></div>`).join("");
 box.querySelectorAll("[data-fsh]").forEach(b=>b.onclick=e=>{e.stopPropagation();shareItem({id:+b.dataset.fsh,media_type:b.dataset.ty,title:b.dataset.title,release_date:b.dataset.y})});
 box.querySelectorAll("[data-cast]").forEach(b=>b.onclick=e=>{e.stopPropagation();openCast({id:+b.dataset.cast,media_type:b.dataset.ty,title:b.dataset.title})});
 box.querySelectorAll("[data-tr]").forEach(b=>b.onclick=e=>{e.stopPropagation();openTrailer({id:+b.dataset.tr,media_type:b.dataset.ty,title:b.dataset.title})});
 box.querySelectorAll(".item").forEach(it=>it.onclick=()=>whereToWatch(it));}catch(e){box.innerHTML=`<div class="empty">${t("searchfail")}: ${e.message}</div>`}}
async function whereToWatch(it){if(it.classList.contains("open"))return;it.classList.add("open");const w=it.querySelector(".where");w.innerHTML="Checking…";
 const d=await api(`/${it.dataset.type||"movie"}/${it.dataset.id}/watch/providers`);const r=d.results[state.region]||{};let h=whereHtml(r);
 if(r.link)h+=`<a href="${r.link}" target="_blank" rel="noopener" class="link" style="text-align:start;padding:4px 0">${t("justwatch")}</a>`;w.innerHTML=h;}

// ---------- list & taste ----------
function renderList(){const l=$("list");const wd=state.watched||[];if(!state.liked.length&&!wd.length){l.innerHTML=`<div class="empty">${t("empty")}</div>`;return}
 const watchedHtml=wd.length?`<h3 style="font-family:var(--display);font-weight:400;letter-spacing:.04em;font-size:22px;margin:14px 0 0">${t("watched")}</h3>`+wd.map(m=>`<div class="item"><img src="${m.poster?IMG+"w185"+m.poster:""}" alt=""><div class="t"><b>${m.title}</b><span>${m.year} · <span class="r">${m.r?"★".repeat(m.r)+"☆".repeat(5-m.r):t("notrated")}</span></span></div><button aria-label="Remove" data-rw="${m.id}" data-rwt="${m.type||"movie"}">✕</button></div>`).join(""):"";
 l.className="list";l.innerHTML=(state.liked.length?`<h3 style="font-family:var(--display);font-weight:400;letter-spacing:.04em;font-size:22px;margin:0">${t("wanttowatch")}</h3>`:"")+state.liked.map(m=>`<div class="item open"><div class="head"><img src="${m.poster?IMG+"w185"+m.poster:""}" alt=""><div class="t"><b>${m.title}</b><span>${m.year} · ★ ${(+m.rating).toFixed(1)}</span></div><button aria-label="Share" data-sh="${m.id}" data-sht="${m.type||"movie"}" data-shn="${m.title.replace(/"/g,"&quot;")}" data-shy="${m.year}">↗</button><button aria-label="Watched" title="Watched" data-wl="${m.id}" data-wt="${m.type||"movie"}">👁</button><button aria-label="Remove" data-rm="${m.id}">✕</button></div><div class="where" data-lw="${m.id}" data-lt="${m.type||"movie"}"></div></div>`).join("")+watchedHtml;
 l.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>shareItem({id:+b.dataset.sh,media_type:b.dataset.sht,title:b.dataset.shn,release_date:b.dataset.shy}));
 l.querySelectorAll("[data-lw]").forEach(async w=>{  try{const d=await api(`/${w.dataset.lt}/${w.dataset.lw}/watch/providers`);w.innerHTML=whereHtml(d.results[state.region]||{})}catch(e){w.innerHTML=""}});
 l.querySelectorAll("[data-wl]").forEach(b=>b.onclick=async()=>{const id=+b.dataset.wl,ty=b.dataset.wt;const li=state.liked.find(x=>x.id===id);if(!li)return;
  let m={id,media_type:ty,title:li.title,release_date:li.year,vote_average:li.rating,poster_path:li.poster,genre_ids:[]};
  try{const d=await api(`/${ty}/${id}`);m.genre_ids=(d.genres||[]).map(g=>g.id)}catch(e){}
  rateDialog(m,document.body,r=>{state.liked=state.liked.filter(x=>x.id!==id);markWatched(m,r,[]);$("count").textContent=state.liked.length;renderList()})});
 l.querySelectorAll("[data-rw]").forEach(b=>b.onclick=()=>{state.watched=state.watched.filter(x=>x.id!=+b.dataset.rw);delete state.seen[(b.dataset.rwt||"movie")+b.dataset.rw];save();renderList()});
 l.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{state.liked=state.liked.filter(x=>x.id!=+b.dataset.rm);$("count").textContent=state.liked.length;save();renderList()});}
function bars(obj,label,name){const keys=Object.keys(obj).filter(k=>obj[k]!==0).sort((a,b)=>obj[b]-obj[a]);if(!keys.length)return"";const max=Math.max(1,...keys.map(k=>Math.abs(obj[k])));
 return`<h3>${label}</h3>`+keys.map(k=>`<div class="bar"><span style="text-align:start;color:var(--fg)">${name(k)}</span><i><b class="${obj[k]<0?"neg":""}" style="width:${Math.abs(obj[k])/max*100}%"></b></i><span>${obj[k]>0?"+":""}${(+obj[k]).toFixed(1)}</span></div>`).join("")}
function renderTaste(){const tb=$("taste");
 tb.innerHTML=`<p style="color:var(--muted);margin:0;font-size:14px">${t("tasteIntro",{a:Object.keys(state.seen).length,b:(state.watched||[]).length})}</p>`
 +bars(state.genre,t("tGenres"),k=>(GENRES.find(g=>g.id==k)||{name:k}).name)+bars(state.decade,t("tEra"),k=>k+"s")
 +`<h3>${t("tServices")}</h3><div class="row">${PROVIDERS.map(p=>`<span class="chip ${state.prov[p.provider_id]>0?"on":""}">${p.provider_name}</span>`).join("")}</div>
 <button class="cta2" id="a2hs2" style="margin-top:10px">📲 ${t("a2hs")}</button><button class="link" id="reset">${t("reset")}</button>`;$("a2hs2").onclick=showA2HS;
 $("reset").onclick=()=>{Object.assign(state,{phase:"genres",idx:0,genre:{},prov:{},decade:{},seen:{},liked:[],watched:[],history:[]});pool=[];MOVIES={};save();$("count").textContent=0;show("intro")};}

$("lang").onclick=async()=>{state.lang=state.lang==="ar"?"en":"ar";save();applyLang();
 if(!$("s-intro").hidden)return;$("stage").innerHTML=`<div class="empty">${t("loading")}</div>`;try{await boot()}catch(e){}pool=[];MOVIES={};
 if(!$("s-swipe").hidden)render();else if(!$("s-list").hidden)renderList();else if(!$("s-find").hidden)searchMovies();else renderTaste()};
let deferredInstall=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
function showA2HS(){const o=document.createElement("div");o.className="trailer";const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
 const ua=navigator.userAgent;const ios=/iPhone|iPad|iPod/.test(ua);const android=/Android/.test(ua);const steps=standalone?[]:t(ios?"ios":android?"android":"desktop");
 o.innerHTML=`<button class="x" aria-label="${t("close")}">✕</button><div class="steps"><b>${t("a2hsT")}</b>${standalone?`<p>${t("installed")}</p>`:steps.map((x,i)=>`<p><span>${i+1}</span>${x}</p>`).join("")}${deferredInstall?`<button class="cta" id="doInstall">${t("installNow")}</button>`:""}</div>`;
 document.body.appendChild(o);o.querySelector(".x").onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};
 const di=o.querySelector("#doInstall");if(di)di.onclick=async()=>{deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;o.remove()}}
function shareUrl(m){const u=new URL(location.href);u.search="";u.hash="";u.searchParams.set("m",mt(m)+"-"+m.id);return u.toString()}
async function shareItem(m){const url=shareUrl(m);const text=t("shareText",{t:m.title,y:String(m.release_date||"").slice(0,4)});
 if(navigator.share){try{await navigator.share({title:m.title,text,url});return}catch(e){if(e.name==="AbortError")return}}
 window.open("https://wa.me/?text="+encodeURIComponent(text+"\n"+url),"_blank")}
async function showDetail(type,id){const o=document.createElement("div");o.className="trailer";o.innerHTML=`<button class="x" aria-label="${t("close")}">✕</button><div class="detail"><div class="body"><p>${t("loading")}</p></div></div>`;
 document.body.appendChild(o);o.querySelector(".x").onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};
 try{const [m,wp]=await Promise.all([api(`/${type}/${id}`),api(`/${type}/${id}/watch/providers`)]);norm(m,type);m.genre_ids=(m.genres||[]).map(g=>g.id);
  const inList=()=>state.liked.some(x=>x.id===m.id);const gn=(m.genres||[]).map(g=>g.name).slice(0,3).join(" · ");
  o.querySelector(".detail").innerHTML=`<div class="cover" style="background-image:url('${m.backdrop_path?IMG+"w780"+m.backdrop_path:(m.poster_path?IMG+"w500"+m.poster_path:"")}')"><h3>${m.title}</h3></div>
   <div class="body"><div class="row"><b>${String(m.release_date).slice(0,4)}</b><span>★ ${(m.vote_average||0).toFixed(1)}</span>${type==="tv"?`<span class="chip on">${t("series")}</span>`:""}<span>${gn}</span></div>
   <p>${m.overview||""}</p><div class="where">${whereHtml(wp.results[state.region]||{})}</div>
   <div class="acts"><button class="cta" id="dAdd">${inList()?t("inList"):t("addList")}</button><button class="cta2" id="dTr">${t("trailer")}</button><button class="cta2" id="dCast">${t("cast")}</button><button class="cta2" id="dShare">↗ ${t("share")}</button></div></div>`;
  o.querySelector("#dAdd").onclick=()=>{if(inList())return;state.liked.push({id:m.id,type,title:m.title,year:String(m.release_date).slice(0,4),rating:m.vote_average,poster:m.poster_path,prov:[]});state.seen[type+m.id]=1;$("count").textContent=state.liked.length;save();o.querySelector("#dAdd").textContent=t("inList")};
  o.querySelector("#dTr").onclick=()=>openTrailer(m);o.querySelector("#dCast").onclick=()=>openCast(m);o.querySelector("#dShare").onclick=()=>shareItem(m);
 }catch(e){o.querySelector(".detail").innerHTML=`<div class="body"><p>${t("searchfail")}</p></div>`}}
(function(){const q=new URLSearchParams(location.search).get("m");if(q){const [ty,id]=q.split("-");if(id){history.replaceState(null,"",location.pathname);const open=()=>showDetail(ty,+id);if($("s-intro").hidden)open();else{$("start").addEventListener("click",()=>setTimeout(open,800),{once:true});(async()=>{if(!GENRES.length)try{await boot()}catch(e){}})();open()}}}})();
$("a2hs").onclick=showA2HS;
function fcount(){const F=state.f;const n=["svc","rating","year","genre","type","lang","rt"].filter(k=>F[k]).length+(F.sort&&F.sort!=="best"?1:0);$("fcount").hidden=!n;$("fcount").textContent=n}
function showFilters(){const F={...state.f};const o=document.createElement("div");o.className="trailer";
 const chips=(key,opts)=>`<div><h4>${opts.label}</h4><div class="chips" data-k="${key}">${opts.items.map(([v,l])=>`<button data-v="${v}" class="${String(F[key])===String(v)?"on":""}">${l}</button>`).join("")}</div></div>`;
 const svc=[["",t("fAnyMine")],...PROVIDERS.filter(p=>p.provider_id).map(p=>[p.provider_id,p.provider_name]),["iptv","IPTV"]];
 o.innerHTML=`<div class="sheet"><h3>${t("fTitle")}</h3>
  ${chips("svc",{label:t("fService"),items:svc})}
  ${chips("rating",{label:t("fRating")+" (TMDB)",items:[[0,t("fAny")],[5,"5+"],[6,"6+"],[7,"7+"],[8,"8+"]]})}
  ${chips("year",{label:t("fYear"),items:[["",t("fAny")],["2024-","2024+"],["2020-2023","2020–23"],["2010-2019","2010s"],["2000-2009","2000s"],["-1999",t("fOlder")]]})}
  ${chips("genre",{label:t("fGenre"),items:[["",t("fAny")],...GENRES.map(g=>[g.id,g.name])]})}
  ${chips("type",{label:t("fType"),items:[["",t("fAny")],["movie",t("tMovies")],["tv",t("tSeries")]]})}
  ${chips("lang",{label:t("fLang"),items:[["",t("fAny")],["ar",t("cAr")],["en",t("cEn")]]})}
  ${chips("rt",{label:t("fRuntime"),items:[["",t("fAny")],["short",t("fShort")],["long",t("fLong")]]})}
  ${chips("sort",{label:t("fSort"),items:[["best",t("fBest")],["top",t("fTop")],["new",t("fNew")],["popular",t("fPopular")]]})}
  <div class="acts"><button class="link" id="fClear">${t("fClear")}</button><button class="cta" id="fApply">${t("fApply")}</button></div></div>`;
 document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};
 o.querySelectorAll(".chips").forEach(c=>c.querySelectorAll("button").forEach(b=>b.onclick=()=>{F[c.dataset.k]=c.dataset.k==="rating"?+b.dataset.v:b.dataset.v;c.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))}));
 const apply=()=>{state.f=F;save();fcount();o.remove();pool=[];MOVIES={};refill.page=0;if(state.phase==="movies"&&!$("s-swipe").hidden)render()};
 o.querySelector("#fApply").onclick=apply;o.querySelector("#fClear").onclick=()=>{Object.assign(F,{svc:"",rating:0,year:"",genre:"",type:"",lang:"",rt:"",sort:"best"});apply()}}
$("fbtn").onclick=showFilters;fcount();
applyLang();
$("count").textContent=state.liked.length;
if(state.key&&(state.phase!=="genres"||state.idx>0)){boot().then(()=>{show("swipe");render()}).catch(()=>show("intro"))}else show("intro");
</script></body></html>
